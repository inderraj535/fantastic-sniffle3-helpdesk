<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bajaj Service Help Desk</title>
  <style>
    :root {
      --red: #0b3d91;
      --red-dark: #072a66;
      --blue: #0b3d91;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d1f23;
      --muted: #6b7280;
      --border: #e2e5ea;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(90deg, var(--red), var(--red-dark));
      color: #fff;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 1.3rem; }
    .subtitle { opacity: 0.9; font-size: 0.8rem; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #374151;
    }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd4dc;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 100px; resize: vertical; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-ghost {
      background: #eef1f5;
      color: var(--text);
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .ticket {
      border: 1px solid var(--border);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: var(--card);
    }
    .ticket-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: baseline;
    }
    .ticket-id {
      font-weight: 700;
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .meta {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 6px;
      background: #eef1f5;
      color: #374151;
    }
    .b-Open { background: #fde8e8; color: var(--danger); }
    .b-InProgress { background: #fef3c7; color: var(--warn); }
    .b-Resolved { background: #dcfce7; color: var(--ok); }
    .empty { color: var(--muted); text-align: center; padding: 24px 12px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 600px) {
      .ticket-head { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Bajaj Service Help Desk</h1>
      <div class="subtitle">2-Wheelers &amp; 3-Wheelers • Customer complaint capture</div>
    </div>
    <button class="btn btn-ghost" id="resetDemoBtn" type="button">Reset demo data</button>
  </header>

  <main>
    <section class="card">
      <h2>New Complaint</h2>
      <form id="complaintForm">
        <div class="grid">
          <div>
            <label for="custName">Customer name</label>
            <input id="custName" name="custName" placeholder="Full name" required />
          </div>
          <div>
            <label for="custPhone">Phone number</label>
            <input id="custPhone" name="custPhone" placeholder="+255 7XX XXX XXX" required />
          </div>
          <div>
            <label for="vehicleType">Vehicle type</label>
            <select id="vehicleType" name="vehicleType">
              <option value="2W">2-Wheeler</option>
              <option value="3W">3-Wheeler</option>
            </select>
          </div>
          <div>
            <label for="model">Model</label>
            <input id="model" name="model" placeholder="Boxer 150 HD" required />
          </div>
          <div>
            <label for="branch">Dealer / branch</label>
            <input id="branch" name="branch" placeholder="e.g. Dar es Salaam - Kariakoo" required />
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Select complaint</option>
              <option>KUBADILISHA MAFUTA YA INJINI</option>
              <option>HUDUMA ZA KAWAIDA</option>
              <option>KELELE KWENYE INJINI</option>
              <option>MOSHI USIO WA KAWAIDA</option>
              <option>KUMISI MAFUTA</option>
              <option>TATIZO LA KUWASHA INJINI</option>
              <option>TATIZO LA UMEME</option>
              <option>INJINI KUPOTEZA NGUVU</option>
            </select>
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="Open" selected>Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
          <div class="full" style="grid-column:1 / -1;">
            <label for="description">Description of the problem</label>
            <textarea id="description" name="description" placeholder="What did the customer report?" required></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save complaint</button>
          <button type="button" class="btn btn-ghost" id="clearFormBtn">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Complaints Log</h2>
      <div id="ticketList"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const STORE_KEY = 'metl_bajaj_helpdesk_v1';
      const APP_CONFIG_URL = './apps-config.json';
      const FIREBASE_CONFIG_URL = './firebase-config.json';
      let tickets = [];
      let GAS_URL = '';
      let useRemote = false;
      let remoteDb = null;
      let remoteCol = null;

      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      async function loadAppConfig() {
        try {
          const res = await fetch(APP_CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return;
          const cfg = await res.json();
          if (cfg && cfg.endpoint) {
            GAS_URL = cfg.endpoint;
          }
        } catch (e) {
          console.warn('Could not read apps config', e);
        }
      }

      async function tryInitRemote() {
        if (typeof firebase === 'undefined') return;
        try {
          const resp = await fetch(FIREBASE_CONFIG_URL, { cache: 'no-store' });
          if (!resp.ok) return;
          const cfg = await resp.json();
          if (!cfg || !cfg.apiKey) return;
          firebase.initializeApp(cfg);
          remoteDb = firebase.firestore();
          remoteCol = remoteDb.collection('complaints');
          useRemote = true;
        } catch (e) {
          console.warn('No Firebase config or init failed', e);
        }
      }

      function readLocalTickets() {
        try {
          tickets = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
        } catch (e) {
          tickets = [];
        }
      }

      async function loadTickets() {
        readLocalTickets();

        if (GAS_URL) {
          try {
            const res = await fetch(GAS_URL + '?t=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
              const rows = await res.json();
              if (Array.isArray(rows) && rows.length) {
                tickets = rows;
                renderTickets();
                return;
              }
            }
          } catch (e) {
            console.warn('Failed to load from GAS', e);
          }
        }

        if (useRemote && remoteCol) {
          try {
            const snapshot = await remoteCol.orderBy('createdAt', 'desc').get();
            tickets = snapshot.docs.map(doc => doc.data());
            renderTickets();
            return;
          } catch (e) {
            console.warn('Failed to fetch remote tickets', e);
          }
        }

        renderTickets();
      }

      function saveLocalTickets() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(tickets));
        } catch (e) {
          console.warn('Unable to write localStorage', e);
        }
      }

      async function saveTickets() {
        saveLocalTickets();

        if (GAS_URL) {
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tickets })
            });
            if (res.ok) {
              return;
            }
          } catch (e) {
            console.warn('Failed to save to GAS', e);
          }
        }

        if (useRemote && remoteDb && remoteCol) {
          try {
            const batch = remoteDb.batch();
            tickets.forEach(ticket => {
              const ref = remoteCol.doc(ticket.id);
              batch.set(ref, ticket, { merge: true });
            });
            await batch.commit();
            return;
          } catch (e) {
            console.warn('Failed to save to Firebase', e);
          }
        }
      }

      function renderTickets() {
        const list = document.getElementById('ticketList');
        if (!tickets.length) {
          list.innerHTML = '<div class="empty">No complaints yet.</div>';
          return;
        }

        list.innerHTML = tickets
          .slice()
          .reverse()
          .map(ticket => {
            const status = ticket.status || 'Open';
            const priority = ticket.priority || 'Medium';
            return `
              <div class="ticket">
                <div class="ticket-head">
                  <div>
                    <span class="ticket-id">${escapeHtml(ticket.id || 'TICKET')}</span>
                    <span class="badge b-${status.replace(/\s+/g, '')}">${escapeHtml(status)}</span>
                    <span class="badge b-${priority}">${escapeHtml(priority)}</span>
                  </div>
                  <div>${escapeHtml(ticket.vehicleType || '2W')}</div>
                </div>
                <div class="meta">
                  ${escapeHtml(ticket.customerName || ticket.custName || '')} • ${escapeHtml(ticket.phone || ticket.custPhone || '')} • ${escapeHtml(ticket.branch || '')}
                </div>
                <div class="meta">${escapeHtml(ticket.category || '')} • ${escapeHtml(ticket.model || '')}</div>
                <div style="margin-top:10px; white-space:pre-wrap;">${escapeHtml(ticket.description || '')}</div>
              </div>
            `;
          })
          .join('');
      }

      function generateId() {
        const random = Math.random().toString(36).slice(2, 8).toUpperCase();
        return `T-${Date.now().toString().slice(-6)}-${random}`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function handleSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        const ticket = {
          id: generateId(),
          customerName: formData.get('custName') || '',
          phone: formData.get('custPhone') || '',
          vehicleType: formData.get('vehicleType') || '2W',
          model: formData.get('model') || '',
          branch: formData.get('branch') || '',
          category: formData.get('category') || '',
          priority: formData.get('priority') || 'Medium',
          status: formData.get('status') || 'Open',
          description: formData.get('description') || '',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };

        tickets.push(ticket);
        await saveTickets();
        renderTickets();
        form.reset();
        showToast('Complaint saved');
      }

      function resetDemoData() {
        tickets = [];
        saveLocalTickets();
        renderTickets();
        showToast('Demo data reset');
      }

      document.getElementById('complaintForm').addEventListener('submit', handleSubmit);
      document.getElementById('clearFormBtn').addEventListener('click', function () {
        document.getElementById('complaintForm').reset();
      });
      document.getElementById('resetDemoBtn').addEventListener('click', resetDemoData);

      async function init() {
        await loadAppConfig();
        await tryInitRemote();
        await loadTickets();
      }

      init();
    })();
  </script>
</body>
</html>
