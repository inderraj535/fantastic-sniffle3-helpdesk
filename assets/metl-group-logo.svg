<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="MeTL Group logo">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .blue { fill: #0b3d91; }
      .yellow { fill: #f4c400; }
      .tag { fill: #000; font-family: Arial, Helvetica, sans-serif; font-weight:700 }
      .group { fill: #0b3d91; font-family: 'Arial Black', Arial, Helvetica, sans-serif; font-weight:900 }
    </style>
  </defs>

  <!-- rounded white background to match PNG -->
  <rect x="8" y="8" width="1184" height="584" rx="42" class="bg"/>

  <!-- M -->
  <g transform="translate(40,60)" >
    <path d="M0 260 L0 120 L48 120 L120 220 L192 120 L240 120 L240 260 L192 260 L192 160 L120 260 L48 160 L48 260 Z" fill="#0b3d91" transform="scale(1.1) translate(20,0)"/>
  </g>

  <!-- Yellow 'e' as circle with cut -->
  <g transform="translate(290,60)">
    <circle cx="150" cy="150" r="130" fill="#f4c400"/>
    <!-- white inner to create ring effect -->
    <circle cx="150" cy="150" r="80" fill="#ffffff"/>
    <!-- e stroke-like wedge to mimic logo cut -->
    <path d="M100 150 a50 50 0 0 1 100 0" fill="#f4c400" transform="translate(0,0)"/>
    <path d="M105 150 L220 95 L220 125 L140 170 Z" fill="#f4c400"/>
    <path d="M160 140 L120 140 L120 160 L160 160 Z" fill="#f4c400"/>
  </g>

  <!-- T and L -->
  <g transform="translate(620,60)">
    <rect x="0" y="0" width="240" height="40" fill="#0b3d91"/>
    <rect x="90" y="0" width="40" height="240" fill="#0b3d91"/>
    <rect x="340" y="0" width="40" height="240" fill="#0b3d91"/>
    <rect x="300" y="200" width="40" height="60" fill="#0b3d91"/>
  </g>

  <!-- GROUP and lines -->
  <g transform="translate(120,360)">
    <line x1="0" y1="40" x2="240" y2="40" stroke="#0b3d91" stroke-width="8" stroke-linecap="round"/>
    <text x="360" y="110" class="group" font-size="110">GROUP</text>
    <line x1="860" y1="40" x2="1120" y2="40" stroke="#0b3d91" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- tagline -->
  <text x="600" y="560" text-anchor="middle" class="tag" font-size="48">The People’s Brand</text>

</svg>
